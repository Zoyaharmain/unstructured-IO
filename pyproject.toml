[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unstructured-pdf-hires-port"
version = "0.1.0"
description = "PDF-only port of Unstructured hi_res processing"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
readme = "README.md"
dependencies = [
  "beautifulsoup4>=4.14.3, <5.0.0",
  "charset-normalizer>=3.4.4, <4.0.0",
  "emoji>=2.15.0, <3.0.0",
  "filetype>=1.2.0, <2.0.0",
  "html5lib>=1.1, <2.0.0",
  "langdetect>=1.0.9, <2.0.0",
  "lxml>=5.0.0, <7.0.0",
  "nh3>=0.3.0, <1.0.0",
  "spacy>=3.7.0, <4.0.0",
  "installer>=0.7.0, <1.0.0",
  "numba>=0.60.0, <1.0.0",
  "numpy>=1.26.0, <3.0.0",
  "psutil>=7.2.2, <8.0.0",
  "python-iso639>=2026.1.31, <2027.0.0",
  "python-magic>=0.4.27, <1.0.0",
  "rapidfuzz>=3.14.3, <4.0.0",
  "regex>=2024.0.0, <2027.0.0",
  "requests>=2.32.5, <3.0.0",
  "tqdm>=4.67.3, <5.0.0",
  "typing-extensions>=4.15.0, <5.0.0",
  "wrapt>=2.1.1, <3.0.0",
  "filelock>=3.12.0,<4.0.0",
  "google-cloud-vision>=3.12.1, <4.0.0",
  "pdf2image>=1.17.0, <2.0.0",
  "pdfminer.six>=20251230, <20270000",
  "pi-heif>=1.2.0, <2.0.0",
  "pikepdf>=10.3.0, <11.0.0",
  "pypdf>=6.9.1, <7.0.0",
  "unstructured-inference>=1.6.12, <2.0.0; platform_system != 'Windows'",
  "unstructured-inference>=1.6.12, <2.0.0; platform_system == 'Windows' and python_version >= '3.12' and python_version < '3.13'",
  "unstructured-pytesseract>=0.3.15, <1.0.0",
  "pandas>=2.0.0, <3.0.0",
  "matplotlib>=3.6.0, <4.0.0"
]

[project.optional-dependencies]
api = ["unstructured[csv,doc,docx,image,md,pdf,pptx,xlsx]==0.27.27", "sentence-transformers==5.7.0", "scikit-learn==1.9.1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1"]
api-test = ["httpx>=0.28,<1", "pytest>=8,<10"]
paddleocr = ["paddlepaddle>=3.3.0,<4", "unstructured-paddleocr==2.10.0"]

[project.scripts]
pdf-hires = "pdf_hires.__main__:main"

[tool.setuptools]
packages = ["local_api", "local_api.core", "local_api.routes", "local_api.schemas", "local_api.services", "local_api.utils", "local_api.vendor", "local_api.vendor.handoff_schema", "pdf_hires", "pdf_hires._vendor", "pdf_hires._vendor.cleaners", "pdf_hires._vendor.common", "pdf_hires._vendor.documents", "pdf_hires._vendor.file_utils", "pdf_hires._vendor.metrics", "pdf_hires._vendor.metrics.table", "pdf_hires._vendor.nlp", "pdf_hires._vendor.partition", "pdf_hires._vendor.partition.common", "pdf_hires._vendor.partition.pdf_image", "pdf_hires._vendor.partition.pdf_image.analysis", "pdf_hires._vendor.partition.utils", "pdf_hires._vendor.partition.utils.ocr_models", "pdf_hires._vendor.patches", "pdf_hires._vendor.staging"]
package-dir = {"" = "src", "local_api" = "local_api"}

[tool.setuptools.package-data]
"local_api" = ["static/*", "static/vendor/*", "data/*.json"]
"local_api.vendor.handoff_schema" = ["README.md", "PROVENANCE.json"]
"*" = ["*.txt", "*.json", "*.jsonl", "*.csv", "*.yaml", "*.yml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
